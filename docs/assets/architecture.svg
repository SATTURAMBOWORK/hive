<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="Georgia, 'Times New Roman', serif">
  <style>
    .bg { fill: #1c1917; }
    .box { fill: #292524; stroke: #44403c; stroke-width: 1.5; }
    .gold { fill: #292524; stroke: #d4a017; stroke-width: 1.6; }
    .t { fill: #fafaf9; font-size: 15px; font-weight: 700; }
    .s { fill: #a8a29e; font-size: 11.5px; font-family: 'Segoe UI', Ubuntu, Helvetica, sans-serif; }
    .lbl { fill: #d4a017; font-size: 11px; letter-spacing: 2px; font-family: 'Segoe UI', Ubuntu, Helvetica, sans-serif; font-weight: 600; }
    .e { stroke: #57534e; stroke-width: 1.8; fill: none; }
    .f { stroke: #e9b949; stroke-width: 2.2; fill: none; stroke-dasharray: 8 12; animation: d 1.4s linear infinite; }
    @keyframes d { to { stroke-dashoffset: -20; } }
    .w { animation: glow 3s ease-in-out infinite; }
    .w2 { animation-delay: 1.5s; }
    @keyframes glow { 0%,100% { stroke: #44403c; } 50% { stroke: #d4a017; } }
  </style>
  <rect class="bg" width="900" height="430" rx="14"/>
  <text x="30" y="36" class="lbl">APTHIVE · SYSTEM ARCHITECTURE</text>

  <!-- client -->
  <rect class="gold" x="300" y="56" width="300" height="62" rx="10"/>
  <text x="450" y="83" class="t" text-anchor="middle">React + Vite (PWA)</text>
  <text x="450" y="103" class="s" text-anchor="middle">Tailwind · Framer Motion · Socket.IO client</text>

  <!-- client -> workers -->
  <path class="e" d="M450 118 V134 H260 V150"/><path class="f" d="M450 118 V134 H260 V150"/>
  <path class="e" d="M450 134 H640 V150"/><path class="f" d="M450 134 H640 V150"/>
  <text x="612" y="92" class="s">⇅ REST + WebSocket</text>

  <!-- workers -->
  <rect class="box w" x="110" y="150" width="300" height="96" rx="10"/>
  <text x="260" y="176" class="t" text-anchor="middle">Node worker #1</text>
  <text x="260" y="197" class="s" text-anchor="middle">Express API · Socket.IO</text>
  <text x="260" y="215" class="s" text-anchor="middle">JWT → tenant middleware → RBAC</text>
  <text x="260" y="233" class="s" text-anchor="middle">rate limiting · helmet · sanitize</text>

  <rect class="box w w2" x="490" y="150" width="300" height="96" rx="10"/>
  <text x="640" y="176" class="t" text-anchor="middle">Node worker #N</text>
  <text x="640" y="197" class="s" text-anchor="middle">Express API · Socket.IO</text>
  <text x="640" y="215" class="s" text-anchor="middle">JWT → tenant middleware → RBAC</text>
  <text x="640" y="233" class="s" text-anchor="middle">rate limiting · helmet · sanitize</text>
  <text x="450" y="203" class="lbl" text-anchor="middle">PM2</text>
  <text x="450" y="219" class="s" text-anchor="middle">cluster</text>

  <!-- workers -> data -->
  <path class="e" d="M260 246 V272 H160 V300"/><path class="f" d="M260 246 V272 H160 V300"/>
  <path class="e" d="M260 272 H440 V300"/><path class="f" d="M260 272 H440 V300"/>
  <path class="e" d="M640 246 V272 H490 V300"/><path class="f" d="M640 246 V272 H490 V300"/>
  <path class="e" d="M640 272 H755 V300"/><path class="f" d="M640 272 H755 V300"/>

  <!-- data layer -->
  <rect class="gold" x="30" y="300" width="260" height="96" rx="10"/>
  <text x="160" y="326" class="t" text-anchor="middle">MongoDB</text>
  <text x="160" y="347" class="s" text-anchor="middle">24 Mongoose models</text>
  <text x="160" y="365" class="s" text-anchor="middle">tenant-scoped compound indexes</text>
  <text x="160" y="383" class="s" text-anchor="middle">unique (pollId, userId) votes</text>

  <rect class="gold" x="320" y="300" width="290" height="96" rx="10"/>
  <text x="465" y="326" class="t" text-anchor="middle">Redis</text>
  <text x="465" y="347" class="s" text-anchor="middle">cache-aside · distributed locks</text>
  <text x="465" y="365" class="s" text-anchor="middle">Pub/Sub · Socket.IO adapter</text>
  <text x="465" y="383" class="s" text-anchor="middle">rate-limit counters · email queue</text>

  <rect class="box" x="640" y="300" width="230" height="96" rx="10"/>
  <text x="755" y="326" class="t" text-anchor="middle">External services</text>
  <text x="755" y="347" class="s" text-anchor="middle">Cloudinary (media)</text>
  <text x="755" y="365" class="s" text-anchor="middle">Nodemailer (OTP email)</text>
  <text x="755" y="383" class="s" text-anchor="middle">QR passes for visitors</text>
</svg>
